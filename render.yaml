# Render blueprint for the Alpha & Oversight backend (FastAPI + SSE).
#
# Render is used (not Vercel) for the backend because the /stream endpoint is a
# long-lived Server-Sent-Events connection, which serverless platforms cut off.
#
# Deploy: push this repo to GitHub → Render → "New +" → "Blueprint" → pick the
# repo. Render reads this file. Then set the secret env vars (marked sync:false)
# in the dashboard. Free plan spins down on idle (~50s cold start on first hit).
services:
  - type: web
    name: alpha-oversight-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && pip install -e . --no-deps"
    startCommand: "uvicorn alpha_oversight.server.app:create_app --factory --host 0.0.0.0 --port $PORT"
    healthCheckPath: /stats
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Keep the keyless demo transport (MockBand) on by default. Flip to true
      # only for a real Band run (requires all BAND_* secrets below).
      - key: USE_REAL_BAND
        value: "false"
      # Comma-separated extra origins for a custom frontend domain. The hosted
      # *.vercel.app frontend is already allowed by the app's CORS regex, so this
      # is only needed for a custom domain, e.g. https://demo.example.com
      - key: ALLOWED_ORIGINS
        sync: false
      # ── Model providers (set in the dashboard; never commit keys) ──
      - key: AIML_API_KEY
        sync: false
      - key: AIML_API_KEY_2
        sync: false
      - key: ADVERSARY_MODEL
        sync: false
      - key: FEATHERLESS_AI_API_KEY
        sync: false
      - key: FEATHERLESS_AI_API_KEY_2
        sync: false
      - key: FEATHERLESS_AI_API_KEY_3
        sync: false
      - key: FEATHERLESS_OPEN_MODEL
        sync: false
      - key: FEATHERLESS_PROSECUTION_MODEL
        sync: false
      - key: FEATHERLESS_DEFENSE_MODEL
        sync: false
      - key: FEATHERLESS_ADJUDICATOR_MODEL
        sync: false
      - key: FEATHERLESS_ESCALATION_MODEL
        sync: false
      # ── Band (only needed when USE_REAL_BAND=true) ──
      - key: BAND_RND_API_KEY
        sync: false
      - key: BAND_RND_AGENT_ID
        sync: false
      - key: BAND_SURV_API_KEY
        sync: false
      - key: BAND_SURV_AGENT_ID
        sync: false
      - key: BAND_SHARED_ROOM
        sync: false
      - key: BAND_HUMAN_PEER
        sync: false
